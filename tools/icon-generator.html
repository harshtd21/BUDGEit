<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Generator</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #121214; color: #F2F1F5; text-align: center; padding: 30px; }
  canvas { border-radius: 20%; margin: 10px; background: #121214; }
  button { padding: 10px 16px; margin: 6px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; background: #BB86FC; color: #121214; font-weight: 600; }
  p { color: #9C9AA6; font-size: 13px; max-width: 480px; margin: 20px auto; }
</style>
</head>
<body>
<h2>BUDGEit App Icon Generator</h2>
<p>Open this file directly in any browser (double-click it). It draws the "budget book" app icon at three sizes and lets you download each as a PNG. Save them into the <code>icons/</code> folder using the exact filenames shown.</p>

<div>
  <canvas id="c512" width="512" height="512"></canvas><br>
  <button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
</div>
<div>
  <canvas id="c192" width="192" height="192"></canvas><br>
  <button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
</div>
<div>
  <canvas id="c180" width="180" height="180"></canvas><br>
  <button onclick="download('c180','apple-touch-icon-180.png')">Download apple-touch-icon-180.png</button>
</div>

<script>
var SVG_MARKUP =
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">' +
  '<defs><linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">' +
  '<stop offset="0" stop-color="#CDA6FF"/><stop offset="1" stop-color="#9B6FE0"/>' +
  '</linearGradient></defs>' +
  '<rect x="0" y="0" width="100" height="100" fill="#121214"/>' +
  '<rect x="21" y="19" width="58" height="68" rx="7" fill="url(#cover)"/>' +
  '<path d="M21 26 a7 7 0 0 1 7 -7 h8 v68 h-8 a7 7 0 0 1 -7 -7 Z" fill="#7C4FCC"/>' +
  '<rect x="43" y="33" width="29" height="4.5" rx="2.25" fill="#1E1E24" opacity="0.85"/>' +
  '<rect x="43" y="45" width="29" height="4.5" rx="2.25" fill="#1E1E24" opacity="0.85"/>' +
  '<rect x="43" y="57" width="18" height="4.5" rx="2.25" fill="#1E1E24" opacity="0.85"/>' +
  '<path d="M58 15 h14 v24 l-7 -6 l-7 6 Z" fill="#FFB703"/>' +
  '</svg>';

function draw(id, size) {
  var canvas = document.getElementById(id);
  var ctx = canvas.getContext("2d");
  var img = new Image();
  var blob = new Blob([SVG_MARKUP], { type: "image/svg+xml" });
  var url = URL.createObjectURL(blob);
  img.onload = function () {
    ctx.drawImage(img, 0, 0, size, size);
    URL.revokeObjectURL(url);
  };
  img.src = url;
}

function download(id, filename) {
  var canvas = document.getElementById(id);
  var link = document.createElement("a");
  link.download = filename;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

draw("c512", 512);
draw("c192", 192);
draw("c180", 180);
</script>
</body>
</html>
