<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Icon Generator</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #222; color: #fff; text-align: center; padding: 30px; }
  canvas { border-radius: 20%; margin: 10px; background: #0B0F14; }
  button { padding: 10px 16px; margin: 6px; font-size: 14px; border-radius: 8px; border: none; cursor: pointer; }
  p { color: #aaa; font-size: 13px; max-width: 480px; margin: 20px auto; }
</style>
</head>
<body>
<h2>Budget App Icon Generator</h2>
<p>Open this file directly in any browser (double-click it). It draws the app icon at three sizes and lets you download each as a PNG. Save them into the <code>icons/</code> folder using the exact filenames shown, then delete this <code>tools/</code> folder before deploying if you like.</p>

<div>
  <canvas id="c512" width="512" height="512"></canvas><br>
  <button onclick="download('c512','icon-512.png')">Download icon-512.png</button>
</div>
<div>
  <canvas id="c192" width="192" height="192"></canvas><br>
  <button onclick="download('c192','icon-192.png')">Download icon-192.png</button>
</div>
<div>
  <canvas id="c180" width="180" height="180"></canvas><br>
  <button onclick="download('c180','apple-touch-icon-180.png')">Download apple-touch-icon-180.png</button>
</div>

<script>
function draw(id, size) {
  var canvas = document.getElementById(id);
  var ctx = canvas.getContext("2d");
  var grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, "#4C8DFF");
  grad.addColorStop(1, "#22A06B");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.round(size * 0.52) + "px -apple-system, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("$", size / 2, size * 0.56);
}

function download(id, filename) {
  var canvas = document.getElementById(id);
  var link = document.createElement("a");
  link.download = filename;
  link.href = canvas.toDataURL("image/png");
  link.click();
}

draw("c512", 512);
draw("c192", 192);
draw("c180", 180);
</script>
</body>
</html>
